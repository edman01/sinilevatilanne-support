name: Tukipyyntö
description: Ilmoita Sinilevätilanne-sovelluksen virheestä tai pyydä apua.
title: "[Tuki] "
body:
  - type: markdown
    attributes:
      value: |
        Kiitos yhteydenotosta. Älä kirjoita tähän lomakkeeseen arkaluonteisia henkilötietoja.
  - type: input
    id: app-version
    attributes:
      label: Sovelluksen versio ja build
      description: Löytyy kohdasta Asetukset → Tietoja sovelluksesta.
      placeholder: Esimerkiksi 1.0 (1)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone-malli ja iOS-versio
      placeholder: Esimerkiksi iPhone 16 Pro, iOS 26.5
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Ongelman kuvaus
      description: Mitä tapahtui, mitä odotit tapahtuvan ja miten ongelman voi toistaa?
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Lisätiedot
      description: Voit liittää kuvakaappauksen, jos siinä ei ole yksityisiä tietoja.
  - type: checkboxes
    id: privacy
    attributes:
      label: Tietosuoja
      options:
        - label: Olen tarkistanut, ettei tukipyyntö sisällä arkaluonteisia henkilötietoja.
          required: true
